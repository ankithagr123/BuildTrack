<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Construction Helmet & Building Mark -->
  <g transform="translate(4, 4)">
    <!-- Building silhouette background -->
    <rect x="2" y="16" width="10" height="24" rx="1.5" fill="#334155" opacity="0.6"/>
    <rect x="14" y="8" width="12" height="32" rx="1.5" fill="#475569" opacity="0.8"/>
    <rect x="28" y="20" width="10" height="20" rx="1.5" fill="#334155" opacity="0.6"/>
    
    <!-- Safety Helmet Foreground Accent -->
    <path d="M 6 22 C 6 12, 34 12, 34 22 Z" fill="#f97316"/>
    <rect x="4" y="22" width="32" height="4" rx="2" fill="#ea580c"/>
    <circle cx="20" cy="16" r="2.5" fill="#ffffff" opacity="0.9"/>

    <!-- Pulse / AI Risk Node -->
    <circle cx="36" cy="10" r="4" fill="#38bdf8"/>
    <path d="M 28 14 L 36 10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Typography: BuildTrack -->
  <text x="52" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Build<tspan fill="#f97316">Track</tspan></text>
  <text x="53" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#94a3b8" letter-spacing="1.2">AI CONSTRUCTION OS</text>
</svg>
